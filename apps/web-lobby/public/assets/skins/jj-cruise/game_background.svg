<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a3a"/>
      <stop offset="55%" stop-color="#1a2f55"/>
      <stop offset="100%" stop-color="#243652"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3558"/>
      <stop offset="100%" stop-color="#0d1c30"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1c"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="18%" cy="16%" r="18%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f0e0a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="160" cy="88" r="120" fill="url(#moonGlow)"/>
  <circle cx="150" cy="80" r="28" fill="#fff6d8"/>
  <!-- distant mountains -->
  <path d="M0 250 L80 190 L140 230 L220 160 L300 220 L380 170 L460 240 L960 240 L960 300 L0 300 Z" fill="#0e1a2e" opacity="0.85"/>
  <!-- sea -->
  <rect y="280" width="960" height="120" fill="url(#sea)"/>
  <!-- city lights strip -->
  <g opacity="0.7">
    <rect x="40" y="255" width="3" height="8" fill="#ffd878"/>
    <rect x="55" y="250" width="2" height="12" fill="#ffe9a0"/>
    <rect x="70" y="258" width="3" height="6" fill="#ffc860"/>
    <rect x="120" y="248" width="2" height="14" fill="#ffe080"/>
    <rect x="200" y="252" width="3" height="10" fill="#ffd070"/>
    <rect x="260" y="246" width="2" height="16" fill="#fff0b0"/>
  </g>
  <!-- cruise ship right -->
  <g transform="translate(620,200)">
    <rect x="20" y="40" width="280" height="70" rx="8" fill="#2a3348"/>
    <rect x="50" y="10" width="200" height="40" rx="6" fill="#343e58"/>
    <rect x="90" y="-10" width="120" height="28" rx="4" fill="#3d4864"/>
    <g fill="#ffd878">
      <rect x="60" y="20" width="8" height="8" rx="1"/><rect x="80" y="20" width="8" height="8" rx="1"/>
      <rect x="100" y="20" width="8" height="8" rx="1"/><rect x="120" y="20" width="8" height="8" rx="1"/>
      <rect x="140" y="20" width="8" height="8" rx="1"/><rect x="160" y="20" width="8" height="8" rx="1"/>
      <rect x="180" y="20" width="8" height="8" rx="1"/><rect x="200" y="20" width="8" height="8" rx="1"/>
      <rect x="40" y="55" width="10" height="10" rx="1"/><rect x="65" y="55" width="10" height="10" rx="1"/>
      <rect x="90" y="55" width="10" height="10" rx="1"/><rect x="115" y="55" width="10" height="10" rx="1"/>
      <rect x="140" y="55" width="10" height="10" rx="1"/><rect x="165" y="55" width="10" height="10" rx="1"/>
      <rect x="190" y="55" width="10" height="10" rx="1"/><rect x="215" y="55" width="10" height="10" rx="1"/>
      <rect x="240" y="55" width="10" height="10" rx="1"/><rect x="265" y="55" width="10" height="10" rx="1"/>
    </g>
  </g>
  <!-- palm silhouettes -->
  <g fill="#071018" opacity="0.9">
    <path d="M40 400 Q60 300 50 280 Q90 320 70 400 Z"/>
    <path d="M70 400 Q100 310 110 270 Q130 330 95 400 Z"/>
    <path d="M880 410 Q900 300 910 270 Q940 330 920 410 Z"/>
    <path d="M910 410 Q930 320 950 280 Q960 340 940 410 Z"/>
  </g>
  <!-- deck planks -->
  <rect y="380" width="960" height="160" fill="url(#deck)"/>
  <g stroke="#4a3424" stroke-width="1" opacity="0.45">
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="0" y1="430" x2="960" y2="430"/>
    <line x1="0" y1="460" x2="960" y2="460"/>
    <line x1="0" y1="490" x2="960" y2="490"/>
    <line x1="0" y1="520" x2="960" y2="520"/>
  </g>
  <!-- oval table felt -->
  <ellipse cx="480" cy="300" rx="300" ry="118" fill="#9aa3ad" opacity="0.55"/>
  <ellipse cx="480" cy="300" rx="280" ry="102" fill="#b0b8c0" opacity="0.35"/>
</svg>
